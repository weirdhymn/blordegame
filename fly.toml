# Fly.io config for BLORSE — one same-origin, STATELESS machine. Durable state lives in
# managed Postgres (Neon), not on this box — so there is no volume to lose (see DEPLOY.md).
# Prepared, NOT deployed. `fly launch` reconciles app name + region; review before deploy.
# DATABASE_URL is a SECRET (it carries the DB password):
#   fly secrets set DATABASE_URL='postgres://…neon.tech/blorse?sslmode=require'
# Open a wave AFTER the persistence canary passes:  fly secrets set INVITE_CODES=wave1-xxxx
app = "blorsegame"
primary_region = "iad" # change to your nearest Fly region

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TRUST_PROXY = "true"
  WEB_DIR = "/app/apps/web/dist"
  DATABASE_SSL = "true" # Neon (and most managed PG) require TLS; DATABASE_URL set via secrets

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Always-on (one machine) keeps the volume attachment + canary test predictable.
  # Cost optimisation later: auto_stop_machines = "stop" + min_machines_running = 0.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

# No [mounts]: the machine is stateless — all durable data lives in managed Postgres, which
# the provider backs up off-disk with point-in-time recovery (DEPLOY.md → Backups). A redeploy
# replaces this container and cannot touch the database.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
