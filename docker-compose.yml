# One-command beta deploy: `docker compose up -d --build`.
# Runs a single BLORSE server instance with its embedded Postgres (PGlite) persisted
# to a named volume. For horizontal scale, swap to managed Postgres (see DEPLOY.md).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      NODE_ENV: production
      DATABASE_URL: 'file:/data/blorse'
    volumes:
      - blorse-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  blorse-data:
